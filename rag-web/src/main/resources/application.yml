server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rag-platform
  # 开启虚拟线程 - JDK 21+ 核心特性
  threads:
    virtual:
      enabled: true
  # 文件上传
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 10

# 数据源配置（Day 2 配置 MySQL）
# spring.datasource.url=jdbc:mysql://localhost:3306/rag_platform

# Milvus 配置（Day 2 配置）
milvus:
  host: localhost
  port: 19530
  collection:
    name: rag_knowledge
    dimension: 1024  # BGE-base-zh 向量维度

# Embedding 配置（Day 4 配置）
embedding:
  provider: remote  # remote | djl
  model: bge-base-zh
  dimension: 1024
  # api-url: https://your-embedding-api.com/v1/embeddings
  # api-key: your-key

# LLM 配置（Day 6 配置）
llm:
  provider: openai-compatible
  model: qwen-plus
  # api-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # api-key: your-key

# 日志配置
logging:
  level:
    root: INFO
    com.landray.rag: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized