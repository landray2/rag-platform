# RAG Platform 中间件一键拉起
# 使用：docker compose up -d
# 停止：docker compose down
services:

  # ====== Redis（限流 / 布隆过滤器 / 缓存 / 会话存储） ======
  redis:
    image: redis:7.2-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

  # ====== MySQL（文档元数据 / 用户 / 知识库） ======
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    ports:
      # 本机已装 MySQL 占用 3306，容器 MySQL 映射到 3307
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: rag_platform
      MYSQL_CHARSET: utf8mb4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  # ====== Milvus Standalone（向量数据库） ======
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: rag-milvus
    restart: unless-stopped
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  # Milvus 依赖：ETCD
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd

  # Milvus 依赖：MinIO（对象存储）
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data

  # ====== Nacos（注册中心 / 配置中心） ======
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: rag-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"

  # ====== RabbitMQ（异步消息 / 文档解析任务队列） ======
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rag-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rag
      RABBITMQ_DEFAULT_PASS: rag123456
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  redis-data:
  mysql-data:
  milvus-data:
  etcd-data:
  minio-data:
  rabbitmq-data:
